<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 陪伴对话</title>
  <meta name="description" content="选择性格、起个名字，开始和你的 AI 女友聊天" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff6fa5'/%3E%3Cstop%20offset='1'%20stop-color='%239b6bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20fill='url(%23g)'%20d='M50%2086C20%2062%208%2046%208%2030%208%2018%2018%2010%2028%2010%2036%2010%2045%2015%2050%2024%2055%2015%2064%2010%2072%2010%2082%2010%2092%2018%2092%2030%2092%2046%2080%2062%2050%2086Z'/%3E%3C/svg%3E" />

  <!-- 代码高亮主题（dark） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 漂浮的爱心背景 -->
  <div class="bg-hearts" aria-hidden="true">
    <span>💗</span><span>💕</span><span>🌸</span><span>💞</span><span>💖</span>
    <span>✨</span><span>💘</span><span>💓</span><span>🌸</span><span>💝</span>
  </div>

  <!-- ============ 登录 / 注册页 ============ -->
  <section class="auth" id="authScreen">
    <div class="auth-card">
      <div class="auth-head">
        <div class="setup-logo">💘</div>
        <h1>AI 陪伴对话</h1>
        <p class="auth-sub">登录或注册，开始你的恋爱之旅</p>
      </div>

      <!-- 登录表单 -->
      <form class="auth-form" id="loginForm">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">登录</button>
          <button type="button" class="auth-tab" data-tab="register">注册</button>
        </div>
        <div class="auth-fields">
          <input class="auth-input" type="text" id="loginUsername" placeholder="用户名" autocomplete="username" maxlength="32" required />
          <input class="auth-input" type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" maxlength="64" required />
        </div>
        <p class="auth-msg" id="loginMsg"></p>
        <button class="btn-start" type="submit" id="btnLogin">💌 登录</button>
      </form>

      <!-- 注册表单 -->
      <form class="auth-form hidden" id="registerForm">
        <div class="auth-tabs">
          <button type="button" class="auth-tab" data-tab="login">登录</button>
          <button type="button" class="auth-tab active" data-tab="register">注册</button>
        </div>
        <div class="auth-fields">
          <input class="auth-input" type="text" id="regUsername" placeholder="用户名（2~32位）" autocomplete="username" maxlength="32" required />
          <input class="auth-input" type="password" id="regPassword" placeholder="密码（4~64位）" autocomplete="new-password" maxlength="64" required />
          <input class="auth-input" type="password" id="regPassword2" placeholder="确认密码" autocomplete="new-password" maxlength="64" required />
        </div>
        <p class="auth-msg" id="regMsg"></p>
        <button class="btn-start" type="submit" id="btnRegister">💌 注册</button>
      </form>

      <p class="auth-skip" id="btnSkipAuth">跳过登录，本地使用（对话不会云端保存）</p>
    </div>
  </section>
  <section class="setup" id="setupScreen">
    <div class="setup-card">
      <div class="setup-head">
        <div class="setup-logo">💘</div>
        <h1>遇见你的 AI 女友</h1>
        <p class="setup-sub">选一个她，再给她起个名字，从此有个只属于你的人</p>
      </div>

      <div class="setup-progress">
        <div class="step">
          <span class="step-num active" id="dot1">1</span>
          <span class="step-label">选择性格</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
          <span class="step-num" id="dot2">2</span>
          <span class="step-label">起个名字</span>
        </div>
      </div>

      <div class="persona-grid" id="personaGrid"></div>

      <div class="name-step hidden" id="nameStep">
        <div class="name-input-wrap">
          <input
            id="nameInput"
            class="name-input"
            type="text"
            maxlength="8"
            placeholder="给她起个名字…"
            autocomplete="off"
          />
          <button class="btn-dice" id="btnDice" type="button" title="随机一个好名字">🎲</button>
        </div>
        <div class="name-preview" id="namePreview"></div>
        <button class="btn-start" id="btnStartChat" type="button">💌 开始对话</button>
      </div>
    </div>
  </section>

  <!-- ============ 聊天界面 ============ -->
  <div class="chat-app hidden" id="chatApp">
    <!-- 电影感氛围背景（真人实拍风） -->
    <div class="chat-bg" aria-hidden="true">
      <img src="assets/bg_chat.png" alt="" onerror="this.style.display='none'" />
      <div class="chat-bg-mask"></div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">💗</span>
          <span class="brand-name">AI 陪伴对话</span>
        </div>
      </div>

      <button class="btn-new-chat" id="btnNewChat" title="开始一段新对话">
        <span class="icon">💌</span>
        <span id="btnNewChatLabel">新建对话</span>
      </button>

      <div class="conv-scroll">
        <div class="conv-list" id="conversationList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="user-row" id="userRow">
          <span class="user-icon">👤</span>
          <span class="user-name" id="userNameDisplay">未登录</span>
          <button class="btn-logout" id="btnLogout" title="退出登录">🚪</button>
        </div>

        <!-- 女友切换区 -->
        <div class="gf-switch" id="gfSwitch">
          <div class="gf-switch-head">
            <span class="chip-emoji" id="gfSwitchEmoji">🌸</span>
            <span class="gf-switch-title">当前女友</span>
          </div>
          <div class="gf-switch-row">
            <label class="gf-switch-label">性格</label>
            <div class="select-wrap">
              <select id="personaSelect">
                <option value="gentle">🌸 温柔</option>
                <option value="hot">🔥 暴躁</option>
                <option value="sharp">⚡ 犀利</option>
                <option value="sweet">🍓 甜美</option>
                <option value="cool">🧊 高冷</option>
              </select>
            </div>
          </div>
          <div class="gf-switch-row">
            <label class="gf-switch-label">名字</label>
            <input class="gf-name-input" id="gfNameInput" type="text" maxlength="8" placeholder="她的名字…" autocomplete="off" />
          </div>
          <button class="btn-apply-gf" id="btnApplyGf">💗 切换女友</button>
        </div>

        <div class="model-row">
          <label class="model-label" for="modelSelect">模型</label>
          <div class="select-wrap">
            <select id="modelSelect">
              <option value="deepseek-chat">DeepSeek Chat · 通用对话</option>
              <option value="deepseek-reasoner">DeepSeek Reasoner · 深度思考</option>
            </select>
          </div>
        </div>
        <div class="status-row" title="后端服务连接状态">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">正在连接后端…</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="header-text">
          <h1 class="chat-title" id="chatTitle">新对话</h1>
          <p class="chat-subtitle" id="chatSubtitle">选择你的她，开始聊天</p>
        </div>
        <div class="header-actions">
          <button class="btn-ghost btn-reconfigure" id="btnReconfigure" title="更换女友性格或名字">💗 更换女友</button>
          <button class="btn-ghost" id="btnClearChat" title="清空当前对话">清空</button>
        </div>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="chat-container">
          <div class="messages" id="messages"></div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-shell">
          <textarea
            id="inputBox"
            class="input-box"
            rows="1"
            placeholder="跟她说点什么吧，回车发送，Shift+Enter 换行…"
          ></textarea>
          <button class="btn-send" id="btnSend" title="发送 (Enter)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h13M13 6l6 6-6 6"/>
            </svg>
          </button>
          <button class="btn-stop hidden" id="btnStop" title="停止生成">
            <span class="stop-icon"></span>
          </button>
        </div>
        <p class="input-hint">内容由 DeepSeek 大模型生成，请注意甄别 · Enter 发送 · Shift+Enter 换行</p>
      </div>
    </main>
  </div>

  <!-- 网络依赖 CDN（本地无网时会在页面上提示） -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
